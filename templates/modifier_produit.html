{% extends "base.html" %}

{% block page_title %}Modifier le Produit{% endblock %}

{% block content %}
<div class="w-full space-y-8 animate-fade-in-up stagger-1 max-w-2xl mx-auto">
    <div class="glass-card p-6 rounded-2xl flex justify-between items-center">
        <div>
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2.5">
                <i data-lucide="package-pen" class="w-5 h-5 text-sky-400"></i> Modifier le Produit
            </h2>
            <p class="text-xs text-slate-400 mt-1">Mettez à jour les informations et le stock de {{ produit.nom }}.</p>
        </div>
        <a href="{{ url_for('produits') }}" class="glass-card hover:bg-white/10 text-slate-200 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour
        </a>
    </div>

    <form action="{{ url_for('modifier_produit', produit_id=produit.id) }}" method="POST" class="glass-card p-8 rounded-2xl space-y-6">
        <div class="floating-group">
            <input type="text" name="nom" value="{{ produit.nom }}" placeholder=" " required class="floating-input">
            <label class="floating-label">Nom du produit *</label>
        </div>
        <div class="floating-group">
            <input type="number" step="0.01" name="prix" value="{{ produit.prix }}" placeholder=" " required class="floating-input">
            <label class="floating-label">Prix unitaire (€) *</label>
        </div>
        <div class="floating-group">
            <input type="number" name="stock" value="{{ produit.stock }}" placeholder=" " required class="floating-input">
            <label class="floating-label">Stock actuel *</label>
        </div>
        <div class="floating-group">
            <input type="number" name="seuil_alerte" value="{{ produit.seuil_alerte }}" placeholder=" " class="floating-input">
            <label class="floating-label">Seuil d'alerte</label>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-white/10">
            <a href="{{ url_for('produits') }}" class="glass-card hover:bg-white/10 px-5 py-2.5 rounded-xl text-sm transition text-slate-300">Annuler</a>
            <button type="submit" class="btn-gradient-success text-white font-medium px-6 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
                <i data-lucide="check" class="w-4 h-4"></i> Enregistrer les modifications
            </button>
        </div>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
